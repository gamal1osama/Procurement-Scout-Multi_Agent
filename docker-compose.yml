version: '3.8'

services:
  procurement-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: procurement-crew-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./outputs:/app/outputs
      - ./config:/app/config
    environment:
      - APP_ENV=production
      - OUTPUT_DIR=/app/outputs

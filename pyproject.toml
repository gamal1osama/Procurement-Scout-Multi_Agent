[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "procurement-crew"
version = "1.0.0"
description = "Enterprise Multi-Agent Procurement Intelligence System built with CrewAI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Rankyx AI Team" }
]
dependencies = [
    "crewai>=1.15.17",
    "crewai-tools>=1.15.17",
    "agentops>=0.4.21",
    "tavily-python>=0.8.0",
    "scrapegraph-py>=2.3.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "chromadb>=1.1.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "typer>=0.27.1",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.3",
    "jinja2>=3.1.6",
    "httpx>=0.28.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "black>=24.4.2",
    "ruff>=0.4.4",
    "mypy>=1.10.0"
]

[project.scripts]
procure = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
